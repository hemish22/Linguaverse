# Render Blueprint for the LinguaLens backend (FastAPI via Docker).
#
# Plan: `free` is fine now — the backend uses Tesseract (no PyTorch), so the
# image and RAM footprint fit Render's free 512MB plan.

services:
  - type: web
    name: lingualens-api
    runtime: docker
    rootDir: lingualens
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Secret: your GROQ API key. Put the real value in the dashboard
      # (not this file) so it stays secret.
      - key: GROQ_API_KEY
        sync: false
      # Comma-separated list of allowed CORS origins.
      # Set this in the dashboard to your Vercel frontend URL, e.g.
      #   https://lingualens.vercel.app
      # (added after the frontend is deployed; envs can be updated any time).
      - key: ALLOWED_ORIGINS
        sync: false